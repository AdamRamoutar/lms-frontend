<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/shared/theme.js"></script>
    <title>Lesson | Carivo</title>
</head>
<body data-layout="app">

    <a href="index.html" class="back-link">Back</a>

    <main class="lesson">
        <h1 class="lesson-title">Loading lesson...</h1>

        <!-- loading text, errors and the log-in prompt appear here -->
        <p class="lesson-message" role="status"></p>

        <section class="lesson-video" hidden>
            <h2>Video</h2>
            <a class="lesson-video-link" target="_blank" rel="noopener noreferrer">Watch the video</a>
        </section>

        <section class="lesson-notes" hidden>
            <h2>Notes</h2>
            <div class="lesson-notes-text"></div>
        </section>
    </main>

    <script src="js/shared/config.js"></script>
    <script src="js/shared/auth.js"></script>
    <script src="js/shared/nav.js"></script>
    <script src="js/shared/header.js"></script>
    <script src="js/pages/content.js"></script>

  

</body>
</html>
