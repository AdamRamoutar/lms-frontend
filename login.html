<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Caribbean Learning Management System</title>
</head>
<body>

    <main class="login-container">
        <h1>Log in</h1>

        <form id="login-form">
            <div>
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" autocomplete="username" required>
            </div>

            <div>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required>
            </div>

            <!-- the script writes error messages here -->
            <p class="form-message" role="alert"></p>

            <button type="submit" class="btn">Log in</button>
        </form>

        <p class="register-link">
            New here? <a href="register.html">Create an account</a>
        </p>
    </main>

    <!-- config.js first (API_URL), then auth.js (token helpers), then this page's script -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="header.js"></script>
    <script src="login.js"></script>

</body>
</html>
