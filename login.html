<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/shared/theme.js"></script>
    <title>Log in | Carivo</title>
</head>

<body>

    <main class="auth-page">
        <aside class="auth-aside" aria-hidden="true">
            <p class="auth-aside-title">Prep for CXC Exams</p>
            <p class="auth-aside-text">Making learning easy and fun</p>
        </aside>

        <section class="auth-panel">
            <div class="auth-card">
                <h1>Log in</h1>

                <form id="login-form">
                    <div class="form-field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" autocomplete="username" required>
                    </div>

                    <div class="form-field">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" autocomplete="current-password"
                            required>
                    </div>

                    <!-- the script writes error messages here -->
                    <p class="form-message" role="alert"></p>

                    <button type="submit" class="btn">Log in</button>
                </form>

                <p class="register-link">
                    New here? <a href="register.html">Create an account</a>
                </p>
            </div>
        </section>
    </main>

    <!-- config.js first (API_URL), then auth.js (token helpers), then header.js then this page's script -->

    <script src="js/shared/config.js"></script>
    <script src="js/shared/auth.js"></script>
    <script src="js/shared/header.js"></script>
    <script src="js/pages/login.js"></script>

</body>

</html>
