<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | Caribbean Learning Management System</title>
</head>
<body>

    <main class="register-container">
        <h1>Create an account</h1>

        <form id="register-form">
            <div>
                <label for="register-email">Email</label>
                <input type="email" id="register-email" name="email" autocomplete="email" required>
            </div>

            <div>
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="password" autocomplete="new-password"
                       minlength="8" aria-describedby="password-hint" required>
                <small id="password-hint">At least 8 characters.</small>
            </div>

            <div>
                <label for="register-confirm-password">Confirm password</label>
                <input type="password" id="register-confirm-password" name="confirm-password"
                       autocomplete="new-password" minlength="8" required>
            </div>

            <!-- the script writes error and success messages here -->
            <p class="form-message" role="alert"></p>

            <button type="submit" class="btn">Create account</button>
        </form>

        <p class="login-link">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </main>

    <!-- config.js first (API_URL), then this page's script. No auth.js, because registering saves no token. -->
    <script src="config.js"></script>
    <script src="register.js"></script>

</body>
</html>
